# Établi Captation: example configuration (schema: specs/config.schema.json)
# Copy it as config.yaml into the user config directory, adjust it and check it with
# `captation check-config`. Accept the disclaimer first (`captation accept`).
#   Linux:   ~/.config/captation/config.yaml  ($XDG_CONFIG_HOME/captation/config.yaml)
#   macOS:   ~/Library/Application Support/captation/config.yaml
#   Windows: %LOCALAPPDATA%\etabli\captation\config.yaml
# Without this file the built-in defaults apply.

schema_version: 1
project_id: PRJ-2026-001          # or null
data_root: ~/CaptationData        # put this on an encrypted volume (storage.require_disk_encryption)
language: de

consent:
  require_armed: true             # cannot be disabled
  auto_disarm_after_minutes: 240
  countdown_seconds: 5
  ask_consent_ref_on_arm: true
  consent_ref_pattern: '^[A-Z0-9-]{3,32}$'
  start_reminder_text: "Aufnahme läuft – bitte die Einwilligung aller Teilnehmenden zu Beginn mündlich bestätigen lassen."

detection:
  poll_interval_ms: 1000
  start_debounce_s: 3
  stop_debounce_s: 10
  rules_file: builtin:default
  user_rules_file: null
  record_unknown_apps: true          # any other app holding the mic (countdown + Cancel as always)
  store_window_titles: false
  extra_meeting_titles: []          # regexes for your own meeting pages, e.g. '^Uni-Konferenz - '

recording:
  audio:
    sample_rate: 48000
    codec_preference: [pcm_s24le, flac, aac]
    tracks: { mix: 1, remote: 2, local: 3, external: null }
    local_input: follow_call      # the call app's mic (any headset); or follow_default / a device name
    external_input_device: null   # input name of an external audio interface (see doctor)
  video:
    capture: window_preferred
    fps: 30
    max_height: 1080
    encoder_preference: [hardware, x264]
  segments_on_mode_change: true

obs:
  executable: null
  websocket:
    host: 127.0.0.1
    port: 4455
    password_source: keyring
    password_env: CAPTATION_OBS_PASSWORD
  profile_audio: Captation-Audio
  profile_video: Captation-Video
  scene_collection: Captation
  launch_args: []                 # verified flags are added by the launcher (PF-003)
  launch_on: arm
  exposure_policy: require_firewall

postprocess:
  extract_tracks: true
  audio_export_format: flac
  remux_video_to: mp4
  keep_original_mkv: true
  checksums: sha256
  make_read_only: true

qc:
  silence_dbfs: -60
  silence_warn_s: 30

storage:
  require_disk_encryption: block   # default (ADR-016): arming is refused on unencrypted storage
  min_free_gb: 10
  age_recipients: []
  retention_days: null

import:
  require_consent_ref: true
  allowed_extensions: [wav, flac, mp3, m4a, opus, ogg]
  max_file_gb: 4

hooks:
  on_session_complete: null       # e.g. ["/usr/local/bin/transcribe-session", "{session_dir}"]
  timeout_s: 3600

ui:
  sound_on_start: true            # indicator, countdown and reminder are always on

logging:
  level: INFO
  dir: null
