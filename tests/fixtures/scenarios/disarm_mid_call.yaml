name: Disarm in the middle of a call
description: >-
  Disarming while recording stops the segment immediately and finalises the session. The
  call continues but nothing is recorded any more; the agent ends disarmed.
reqs: [R-14, R-16]
apps:
  signal: {pid: 300, process_name: signal-desktop}
steps:
  - {t: 0, event: arm, consent_ref: CR-2026-005, expect: [Armed, "SetTrayState(armed)", PrewarmObs]}
  - {t: 1, mic: [signal], expect: [], state: PENDING_START}
  - {t: 4, mic: [signal], expect: ["BeginSession(signal)", "NotifyCountdown(signal,5)"]}
  - t: 9
    mic: [signal]
    expect:
      - CloseCountdown
      - "SetTrayState(recording,audio,signal)"
      - "StartSegment(1,audio,rule:default)"
      - "WriteSessionJson(recording)"
      - ShowReminder
    state: RECORDING
  - {t: 20, event: disarm, expect: ["StopSegment(1)", Teardown, "Disarmed(user)"], state: STOPPING}
  - {t: 21, mic: [signal], expect: [], state: STOPPING}
  - t: 22
    event: segment_stopped
    expect: [RunPostprocess, "SetTrayState(disarmed)"]
    state: POSTPROCESSING
  - {t: 23, mic: [signal], expect: [], state: POSTPROCESSING}
  - {t: 30, event: postprocess_done, expect: ["WriteSessionJson(complete)"], state: DISARMED}
  - {t: 31, mic: [signal], expect: [], state: DISARMED}
  - {t: 60, mic: [signal], expect: [], state: DISARMED}
final_state: DISARMED
sessions: 1
