# Monthly update pull requests. Actions stay pinned to full commit SHAs: Dependabot updates the
# SHA together with the version comment after it. Python dependencies are updated in uv.lock.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        patterns: ["*"]
