name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # this job creates the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --group build
      - name: "Platform facts (release mode: no pending facts allowed)"
        run: uv run python tools/check_facts.py --release
      - run: packaging/linux/build.sh
      - name: SBOM
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt > dist/runtime-requirements.txt
          uvx --from cyclonedx-bom==9.0.0 cyclonedx-py requirements dist/runtime-requirements.txt -o dist/sbom.cdx.json
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/sbom.cdx.json

  macos:
    # Runs after the linux job, which creates the draft release; this job adds its assets.
    needs: linux
    runs-on: macos-latest
    permissions:
      contents: write  # upload to the draft release
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --group build
      - name: "Platform facts (release mode: no pending facts allowed)"
        run: uv run python tools/check_facts.py --release
      - name: Swift toolchain
        run: swift --version
      - name: Import the Developer ID certificate (only when the secrets are set)
        run: |
          if [ -z "${MACOS_CERT_P12_BASE64}" ]; then
            echo "no signing secrets: the build is ad-hoc signed and not notarised"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Build Établi Captation.app (zip + dmg)
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: packaging/macos/build.sh
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          append_body: true
          body_path: dist/macos-signing.txt
          files: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256

  windows:
    # Runs after the linux job, which creates the draft release; this job adds its files.
    needs: linux
    runs-on: windows-latest
    permissions:
      contents: write  # uploads to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --group build
      - name: "Platform facts (release mode: no pending facts allowed)"
        run: uv run python tools/check_facts.py --release
      - name: "Build zip and installer (unsigned; Inno Setup from the runner image if present)"
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Installer
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
